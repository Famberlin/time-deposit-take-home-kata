name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [java, kotlin]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Build and test
        run: mvn -B verify -Dspotless.apply.skip=true

  snyk:
    name: snyk (java)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: java
    steps:
      - name: Skip without SNYK_TOKEN
        if: env.SNYK_TOKEN == ''
        working-directory: .
        run: echo "::notice::SNYK_TOKEN secret is not set; skipping the Snyk scan."
      - uses: actions/checkout@v7
        if: env.SNYK_TOKEN != ''
      - uses: actions/setup-java@v6
        if: env.SNYK_TOKEN != ''
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Scan dependencies
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk@1 test --file=pom.xml --severity-threshold=high
