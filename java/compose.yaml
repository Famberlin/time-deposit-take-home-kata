# Local run: PostgreSQL plus the service with demo data.
#   docker compose up --build
# API and Swagger UI: http://localhost:8080/swagger-ui.html, actuator: http://localhost:8081/actuator/health
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: time_deposits
      POSTGRES_USER: time_deposits
      POSTGRES_PASSWORD: time_deposits
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_deposits -d time_deposits"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/time_deposits
      SPRING_DATASOURCE_USERNAME: time_deposits
      SPRING_DATASOURCE_PASSWORD: time_deposits
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  postgres-data:
