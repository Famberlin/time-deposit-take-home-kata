# Local run: PostgreSQL plus the service with demo data.
#   cp .env.example .env   # once; credentials live in .env (git-ignored)
#   docker compose up --build
# API and Swagger UI: http://localhost:8080/swagger-ui.html, actuator: http://localhost:8081/actuator/health
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env, see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env, see .env.example}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set in .env, see .env.example}
      DATABASE_USERNAME: ${POSTGRES_USER:?set in .env, see .env.example}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set in .env, see .env.example}
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  postgres-data:
