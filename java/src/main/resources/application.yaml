spring:
  application:
    name: time-deposit
  # No credentials or defaults here: the values come from DATABASE_URL, DATABASE_USERNAME and
  # DATABASE_PASSWORD. The standard SPRING_DATASOURCE_* variables still override them.
  # Tests get theirs from Testcontainers (@ServiceConnection in PostgresContainerConfiguration).
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate

time-deposits:
  balance-update:
    # Deposits locked and updated per transaction by PUT /api/v1/time-deposits/balances.
    # Env: TIME_DEPOSITS_BALANCE_UPDATE_BATCH_SIZE
    batch-size: 500

# Actuator is off by default so the API port serves only the two endpoints.
# The local and dev profiles turn it on, on a separate management port.
management:
  server:
    port: -1
  endpoints:
    access:
      default: none
