spring:
  application:
    name: time-deposit
  # No datasource here on purpose: the connection and its credentials come only from the
  # environment (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
  # Tests get theirs from Testcontainers (@ServiceConnection in PostgresContainerConfiguration).
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate

time-deposits:
  balance-update:
    # Deposits locked and updated per transaction by PUT /api/v1/time-deposits/balances.
    # Env: TIME_DEPOSITS_BALANCE_UPDATE_BATCH_SIZE
    batch-size: 500

# Actuator is off by default so the API port serves only the two endpoints.
# The local and dev profiles turn it on, on a separate management port.
management:
  server:
    port: -1
  endpoints:
    access:
      default: none
